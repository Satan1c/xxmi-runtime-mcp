name: CI

on:
  push:
    branches: [main, dev/satan1c]
  pull_request:
    branches: [main, dev/satan1c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: Companion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  patched-dll:
    name: Patched XXMI DLL (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read the pinned DLL source revision
        id: source
        shell: bash
        run: |
          revision=$(<adapters/base-revision.txt)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full Git commit SHA in adapters/base-revision.txt" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the DLL source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Satan1c/XXMI-Libs-Package
          ref: ${{ steps.source.outputs.revision }}
          path: dll
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the telemetry patch
        working-directory: dll
        shell: bash
        run: git apply --whitespace=error ../adapters/satan1c-dev.patch
      - name: Fetch upstream tags for version generation
        working-directory: dll
        run: git fetch --no-tags https://github.com/SpectrumQT/XXMI-Libs-Package.git "refs/tags/v*:refs/tags/v*"
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          vs-version: '[17.0,18.0)'
      - name: Build the x64 package
        working-directory: dll
        run: msbuild StereoVisionHacks.sln '-property:Configuration=Zip Release' -property:Platform=x64 -target:rebuild -verbosity:minimal
      - name: Upload the patched DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xxmi-patched-windows-x64
          path: dll/x64/Zip Release/d3d11.dll
          if-no-files-found: error
